<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="ftGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ftGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dcfce7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbf7d0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="480" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a1a1a">多源行情与故障转移机制</text>
  <text x="480" y="75" text-anchor="middle" font-size="16" fill="#6b7280">Slide 10 · 投资组合管理系统</text>
  
  <!-- Step 1: Cached API -->
  <g transform="translate(480, 140)">
    <rect x="-320" y="-50" width="640" height="100" rx="12" fill="url(#ftGrad1)" stroke="#3b82f6" stroke-width="3"/>
    <text x="0" y="-15" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e40af">🥇 Cached API（主数据源）</text>
    <text x="0" y="15" text-anchor="middle" font-size="14" fill="#1e3a8a">课程提供的缓存价格服务 - 优先使用，减少外部 API 调用</text>
  </g>
  
  <!-- Arrow 1 -->
  <g transform="translate(480, 240)">
    <polygon points="0,20 -10,0 -5,0 -5,-15 5,-15 5,0 10,0" fill="#3b82f6"/>
    <text x="30" y="8" font-size="13" fill="#6b7280">失败时自动切换</text>
  </g>
  
  <!-- Step 2: Alpha Vantage -->
  <g transform="translate(480, 300)">
    <rect x="-320" y="-50" width="640" height="100" rx="12" fill="url(#ftGrad1)" stroke="#3b82f6" stroke-width="3"/>
    <text x="0" y="-15" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e40af">🥈 Alpha Vantage（备用数据源）</text>
    <text x="0" y="15" text-anchor="middle" font-size="14" fill="#1e3a8a">美股数据 - 专业金融 API，提供实时和历史行情</text>
  </g>
  
  <!-- Arrow 2 -->
  <g transform="translate(480, 400)">
    <polygon points="0,20 -10,0 -5,0 -5,-15 5,-15 5,0 10,0" fill="#3b82f6"/>
    <text x="30" y="8" font-size="13" fill="#6b7280">失败时自动切换</text>
  </g>
  
  <!-- Step 3: Sina -->
  <g transform="translate(480, 460)">
    <rect x="-320" y="-50" width="640" height="100" rx="12" fill="url(#ftGrad1)" stroke="#3b82f6" stroke-width="3"/>
    <text x="0" y="-15" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e40af">🥉 新浪财经（特定市场）</text>
    <text x="0" y="15" text-anchor="middle" font-size="14" fill="#1e3a8a">A 股 (sh/sz) / 港股 (hk) - 国内数据源，支持沪深港市场</text>
  </g>
  
  <!-- Cache Box -->
  <g transform="translate(480, 270)">
    <rect x="340" y="-180" width="260" height="140" rx="12" fill="url(#ftGrad2)" stroke="#22c55e" stroke-width="3"/>
    <text x="0" y="-145" text-anchor="middle" font-size="18" font-weight="bold" fill="#166534">💾 内存缓存</text>
    <text x="0" y="-120" text-anchor="middle" font-size="13" fill="#14532d">ConcurrentHashMap 实现</text>
    <text x="0" y="-95" text-anchor="middle" font-size="13" fill="#14532d">价格缓存 TTL: 5 分钟</text>
    <text x="0" y="-70" text-anchor="middle" font-size="13" fill="#14532d">历史序列 TTL: 10 分钟</text>
    <text x="0" y="-45" text-anchor="middle" font-size="13" fill="#14532d">减少 API 调用，提升响应速度</text>
  </g>
  
  <!-- Highlights -->
  <g transform="translate(140, 520)">
    <rect x="-100" y="-25" width="200" height="50" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">✅ 价格缓存 5min / 历史序列 10min</text>
  </g>
  
  <g transform="translate(480, 520)">
    <rect x="-100" y="-25" width="200" height="50" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">🔄 自动故障转移 / 无需人工干预</text>
  </g>
  
  <g transform="translate(820, 520)">
    <rect x="-100" y="-25" width="200" height="50" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">🛡️ 优雅降级处理 / 返回"—"不崩溃</text>
  </g>
</svg>