<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4f46e5"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="480" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a1a1a">数据模型 - ER 关系图</text>
  <text x="480" y="75" text-anchor="middle" font-size="16" fill="#6b7280">Slide 8 · 投资组合管理系统</text>
  
  <!-- Portfolio Entity -->
  <g transform="translate(200, 270)">
    <rect x="-140" y="-130" width="280" height="260" rx="10" fill="white" stroke="#4f46e5" stroke-width="3"/>
    <rect x="-140" y="-130" width="280" height="50" rx="10" fill="#4f46e5"/>
    <text x="0" y="-97" text-anchor="middle" font-size="20" font-weight="bold" fill="white">Portfolio</text>
    
    <line x1="-120" y1="-60" x2="120" y2="-60" stroke="#e5e7eb" stroke-width="2"/>
    <text x="-120" y="-35" font-size="13" fill="#374151">id: INT (PK)</text>
    <text x="-120" y="-15" font-size="13" fill="#374151">name: VARCHAR(200)</text>
    <text x="-120" y="5" font-size="13" fill="#374151">description: TEXT</text>
    <text x="-120" y="25" font-size="13" fill="#374151">baseCurrency: VARCHAR(8)</text>
    <text x="-120" y="45" font-size="13" fill="#374151">createdAt: DATETIME</text>
    <text x="-120" y="65" font-size="13" fill="#374151">holdings: List&lt;Holding&gt;</text>
    <text x="-120" y="85" font-size="13" fill="#374151">─────────────────────</text>
    <text x="-120" y="105" font-size="11" fill="#6b7280" font-style="italic">设计原则：持仓结构化落库</text>
  </g>
  
  <!-- Relationship line -->
  <line x1="360" y1="270" x2="600" y2="270" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="430" y="255" font-size="16" font-weight="bold" fill="#4f46e5">1</text>
  <text x="540" y="255" font-size="16" font-weight="bold" fill="#4f46e5">N</text>
  
  <!-- Holding Entity -->
  <g transform="translate(760, 270)">
    <rect x="-140" y="-150" width="280" height="300" rx="10" fill="white" stroke="#4f46e5" stroke-width="3"/>
    <rect x="-140" y="-150" width="280" height="50" rx="10" fill="#4f46e5"/>
    <text x="0" y="-117" text-anchor="middle" font-size="20" font-weight="bold" fill="white">Holding</text>
    
    <line x1="-120" y1="-80" x2="120" y2="-80" stroke="#e5e7eb" stroke-width="2"/>
    <text x="-120" y="-55" font-size="13" fill="#374151">id: INT (PK)</text>
    <text x="-120" y="-35" font-size="13" fill="#374151">portfolio_id: INT (FK)</text>
    <text x="-120" y="-15" font-size="13" fill="#374151">assetType: ENUM(stock/bond/cash)</text>
    <text x="-120" y="5" font-size="13" fill="#374151">ticker: VARCHAR(32)</text>
    <text x="-120" y="25" font-size="13" fill="#374151">quantity: DOUBLE</text>
    <text x="-120" y="45" font-size="13" fill="#374151">averageCost: DOUBLE</text>
    <text x="-120" y="65" font-size="13" fill="#374151">purchaseDate: DATE</text>
    <text x="-120" y="85" font-size="13" fill="#374151">portfolio: Portfolio</text>
    <text x="-120" y="105" font-size="13" fill="#374151">─────────────────────</text>
    <text x="-120" y="125" font-size="11" fill="#6b7280" font-style="italic">估值按需计算</text>
  </g>
</svg>